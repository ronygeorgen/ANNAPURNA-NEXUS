      - DATABASE_PORT=5432
      - ALLOWED_HOSTS=*
      - SECRET_KEY=django-insecure-gkcv)b3abp%(orrp2fk7dw7(nt9vm)ss!64mq6x-mh&tw4m$b
      - KAFKA_HOST=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: >
      sh -c "
        while ! nc -z postgres 5432; do
          echo 'Waiting for PostgreSQL to be ready...'
          sleep 1
