apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ronygeorge.jacg@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: annapoornanexus-tls
  namespace: default
spec:
  secretName: annapoornanexus-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: annapoornanexus.ronygeorge.online
  dnsNames:
  - annapoornanexus.ronygeorge.online