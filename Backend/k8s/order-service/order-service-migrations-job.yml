apiVersion: batch/v1
kind: Job
metadata:
  name: order-service-migrations
spec:
  template:
    spec:
      containers:
      - name: migrations
        image: ronygeorgen/order-service:latest
        command: 
        - /bin/sh
        - -c
        - |
          python manage.py makemigrations
          python manage.py migrate
        envFrom:
        - configMapRef:
            name: common-configmap
        - secretRef:
            name: common-secret
        env:
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: common-configmap
              key: ORDER_SERVICE_DB
      restartPolicy: Never
  backoffLimit: 4